# 低内存开发机约束：Gradle/Kotlin daemon 限制堆大小、workers 串行化，避免提交内存耗尽（errno 1455）。
org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx256m
org.gradle.workers.max=1
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
