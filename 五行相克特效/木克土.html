<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五行相克：木克土</title>
<style>
    /* 全局重置与透明背景 */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* 适配 WebView 小槽位的 SVG 容器 */
    svg {
        width: 100%;
        height: 100%;
        max-width: 300px;
        max-height: 300px;
        display: block;
    }

    /* =========================================
       动画关键帧 (总时长 5s)
       ========================================= */

    /* 1. 全局循环淡出重置 */
    @keyframes globalFade {
        0%, 90% { opacity: 1; }
        95%, 100% { opacity: 0; }
    }

    /* 2. 主根向下生长 (1.0s 开始伸长，3.4s 扎入深处) */
    @keyframes mainRootGrow {
        0%, 20% { stroke-dashoffset: 60; opacity: 0; }               
        21%     { stroke-dashoffset: 60; opacity: 1; }               
        68%, 90%{ stroke-dashoffset: 0;  opacity: 1; }               
        95%,100%{ stroke-dashoffset: 0;  opacity: 0; }
    }

    /* 3. 主裂纹扩展 (延后至根扎入后出现) */
    @keyframes mainCrackSpread {
        0%, 48% { stroke-dashoffset: 50; opacity: 0; }               
        49%     { stroke-dashoffset: 50; opacity: 1; }               
        68%, 90%{ stroke-dashoffset: 0;  opacity: 1; }               
        95%,100%{ stroke-dashoffset: 0;  opacity: 0; }
    }

    /* 4. 侧裂纹扩展 (稍微延迟于主裂纹) */
    @keyframes sideCrackSpread {
        0%, 52% { stroke-dashoffset: 30; opacity: 0; }               
        53%     { stroke-dashoffset: 30; opacity: 1; }
        68%, 90%{ stroke-dashoffset: 0;  opacity: 1; }
        95%,100%{ stroke-dashoffset: 0;  opacity: 0; }
    }

    /* 5. 侧根生长 (3.4s 主根深入后长出，4.4s 完成) */
    @keyframes sideRootGrow {
        0%, 68% { stroke-dashoffset: 30; opacity: 0; }               
        69%     { stroke-dashoffset: 30; opacity: 1; }               
        88%, 90%{ stroke-dashoffset: 0;  opacity: 1; }               
        95%,100%{ stroke-dashoffset: 0;  opacity: 0; }
    }

    /* 6. 土粒轻微松动位移 (3.4s 被根挤开) */
    @keyframes particleShift {
        0%, 68% { opacity: 0; transform: translate(0, 0); }
        69%     { opacity: 1; transform: translate(0, 0); }
        88%, 90%{ opacity: 1; transform: translate(var(--dx), var(--dy)); } 
        95%,100%{ opacity: 0; transform: translate(var(--dx), var(--dy)); }
    }

    /* =========================================
       SVG 元素样式
       ========================================= */

    .fade-group {
        animation: globalFade 5s linear infinite;
    }

    /* 土层 */
    .soil-body { fill: #B8862F; }
    .soil-surface { fill: #D8A600; }

    /* 种子与绿芽 */
    .seed-body { fill: #A8D5A2; }
    .seed-sprout { fill: #2F8F5B; }

    /* 裂纹 */
    .crack-main {
        stroke: #3D2815;
        stroke-width: 1.5; /* 加粗主裂纹强化克制感 */
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        opacity: 0;
        animation: mainCrackSpread 5s ease-in-out infinite;
    }
    .crack-side {
        stroke: #5A3A1C;
        stroke-width: 0.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 30;
        stroke-dashoffset: 30;
        opacity: 0;
        animation: sideCrackSpread 5s ease-in-out infinite;
    }

    /* 木根 */
    .main-root {
        stroke: #2F8F5B;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        opacity: 0;
        animation: mainRootGrow 5s linear infinite;
    }
    .side-root {
        stroke: #528747;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-dasharray: 30;
        stroke-dashoffset: 30;
        opacity: 0;
        animation: sideRootGrow 5s ease-out infinite;
    }

    /* 土粒 */
    .particle {
        fill: #8A6A32;
        opacity: 0;
        animation: particleShift 5s ease-out infinite;
    }

</style>
</head>
<body>

<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    
    <!-- 全局淡出控制组 -->
    <g class="fade-group">
        
        <!-- 1. 土层 (下方静置) -->
        <g class="soil-group">
            <!-- 黄褐色深土层 -->
            <path class="soil-body" d="M 5 45 Q 50 43 95 45 L 95 95 Q 50 98 5 95 Z" />
            <!-- 土层高光表面 (y=45附近) -->
            <path class="soil-surface" d="M 5 45 Q 50 43 95 45 L 90 50 Q 50 48 10 50 Z" />
        </g>

        <!-- 2. 破裂的土层裂纹 (被木根制约撑开) -->
        <g class="cracks-group">
            <!-- 中心主裂纹，从表面接触点向下蔓延 -->
            <path class="crack-main" d="M 50 45 L 48 53 L 53 61 L 47 70 L 51 80" />
            <!-- 左侧细裂纹 -->
            <path class="crack-side" d="M 48 53 L 40 57 L 35 63" />
            <!-- 右侧细裂纹 -->
            <path class="crack-side" d="M 53 61 L 61 64 L 66 71" />
        </g>

        <!-- 3. 木的主根与侧根 (扎入土中) -->
        <g class="roots-group">
            <!-- 左侧小根 -->
            <path class="side-root" d="M 49 61 Q 42 66 38 74" />
            <!-- 右侧小根 -->
            <path class="side-root" d="M 50 71 Q 57 74 61 82" />
            <!-- 绿色主根 (略微弯曲的S形，向下穿透) -->
            <path class="main-root" d="M 50 44 C 44 54, 56 64, 49 74 C 46 79, 52 83, 50 85" />
        </g>

        <!-- 4. 被根系挤开的松动土粒 (极少量，位移极小) -->
        <g class="particles-group">
            <circle class="particle" cx="47" cy="46" r="1.2" style="--dx: -3px; --dy: -1px;" />
            <circle class="particle" cx="53" cy="47" r="1.0" style="--dx: 3px; --dy: 0px;" />
            <circle class="particle" cx="50" cy="48" r="0.8" style="--dx: -1px; --dy: 2px;" />
        </g>

        <!-- 5. 土层表面的种子与嫩芽 (静置于土面，根从底部长出) -->
        <g class="seed-group">
            <!-- 浅绿色种子主体贴合土面 -->
            <ellipse class="seed-body" cx="50" cy="43" rx="4.5" ry="2.5" />
            <!-- 破壳向上的一点小绿芽 (已修正 typo) -->
            <!-- 如果实机测试发现依然抢戏，可以直接删除这行 <path> 元素 -->
            <path class="seed-sprout" d="M 50 41 Q 47 36 52 35 Q 51 38 50 41 Z" />
        </g>

    </g>

</svg>

</body>
</html>
