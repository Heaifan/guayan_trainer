name: Build Return Relation APK

on:
  push:
    branches:
      - feat/return-relation-svg-r1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Return relation tests
        run: flutter test test/presentation/review/return_relation_glyph_test.dart test/presentation/review/relation_overlay_test.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guayan-return-relation-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
