name: Build Android APK

on:
  push:
    branches:
      - guayan-fix
    paths-ignore:
      - 'docs/governance/**'
  workflow_dispatch:

concurrency:
  group: guayan-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Relation UI tests
        run: >
          flutter test
          test/presentation/review/routing/relation_bezier_path_test.dart
          test/presentation/review/relation_orthogonal_router_test.dart
          test/presentation/review/relation_label_placer_test.dart
          test/presentation/review/relation_overlay_test.dart
          test/presentation/review/relation_visual_protocol_test.dart
          test/presentation/review/return_relation_glyph_test.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guayan-apk-2.0.6.49
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
